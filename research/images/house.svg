<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <rect width="480" height="270" fill="#eef4fb"/>
  <circle cx="400" cy="60" r="24" fill="#ffd166"/>
  <rect y="220" width="480" height="50" fill="#dce9d3"/>
  <polygon points="225,225 255,225 285,270 195,270" fill="#eadcb8"/>
  <!-- tree -->
  <rect x="88" y="175" width="14" height="50" rx="3" fill="#8b5e3c"/>
  <circle cx="95" cy="150" r="42" fill="#7fb77e"/>
  <circle cx="72" cy="165" r="24" fill="#6fa86e"/>
  <!-- chimney -->
  <rect x="278" y="80" width="20" height="40" fill="#2c3e50"/>
  <!-- house -->
  <rect x="170" y="130" width="140" height="95" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>
  <polygon points="152,136 240,68 328,136" fill="#2780e3" stroke="#2c3e50" stroke-width="4" stroke-linejoin="round"/>
  <!-- door -->
  <rect x="225" y="170" width="30" height="55" rx="3" fill="#f0a04b" stroke="#2c3e50" stroke-width="3"/>
  <circle cx="249" cy="199" r="2.5" fill="#2c3e50"/>
  <!-- windows -->
  <g stroke="#2c3e50" stroke-width="3">
    <rect x="184" y="150" width="30" height="30" fill="#ffe8a3"/>
    <line x1="199" y1="150" x2="199" y2="180"/>
    <line x1="184" y1="165" x2="214" y2="165"/>
    <rect x="266" y="150" width="30" height="30" fill="#ffe8a3"/>
    <line x1="281" y1="150" x2="281" y2="180"/>
    <line x1="266" y1="165" x2="296" y2="165"/>
  </g>
  <!-- small bushes -->
  <circle cx="345" cy="222" r="14" fill="#7fb77e"/>
  <circle cx="365" cy="225" r="10" fill="#6fa86e"/>
</svg>
