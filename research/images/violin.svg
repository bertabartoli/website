<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <rect width="480" height="270" fill="#eef4fb"/>
  <!-- music notes -->
  <g fill="#2780e3" stroke="#2780e3">
    <ellipse cx="380" cy="78" rx="9" ry="7" transform="rotate(-20 380 78)" stroke="none"/>
    <line x1="388" y1="75" x2="388" y2="38" stroke-width="3"/>
    <path d="M388,38 q14,6 12,22" fill="none" stroke-width="3"/>
    <ellipse cx="415" cy="120" rx="9" ry="7" transform="rotate(-20 415 120)" stroke="none"/>
    <ellipse cx="445" cy="110" rx="9" ry="7" transform="rotate(-20 445 110)" stroke="none"/>
    <line x1="423" y1="117" x2="423" y2="82" stroke-width="3"/>
    <line x1="453" y1="107" x2="453" y2="72" stroke-width="3"/>
    <line x1="423" y1="82" x2="453" y2="72" stroke-width="5"/>
  </g>
  <g transform="translate(225,138) rotate(35) scale(0.8)">
    <!-- body -->
    <path d="M0,-20 C30,-22 47,-10 46,15 C45,35 30,40 30,55 C30,70 57,75 56,110 C55,140 30,150 0,150 C-30,150 -55,140 -56,110 C-57,75 -30,70 -30,55 C-30,40 -45,35 -46,15 C-47,-10 -30,-22 0,-20 Z"
          fill="#c0702a" stroke="#5a2e0e" stroke-width="3"/>
    <!-- f-holes -->
    <g fill="none" stroke="#3a1a05" stroke-width="3" stroke-linecap="round">
      <path d="M-22,68 C-32,80 -12,94 -22,106"/>
      <path d="M22,68 C32,80 12,94 22,106"/>
    </g>
    <!-- scroll and pegbox -->
    <rect x="-6" y="-142" width="12" height="22" fill="#7a3f12"/>
    <circle cx="0" cy="-150" r="10" fill="#7a3f12" stroke="#5a2e0e" stroke-width="2"/>
    <circle cx="0" cy="-150" r="4" fill="none" stroke="#3a1a05" stroke-width="2"/>
    <g fill="#2c2c2c">
      <rect x="-14" y="-137" width="8" height="4" rx="1"/>
      <rect x="6" y="-131" width="8" height="4" rx="1"/>
      <rect x="-14" y="-126" width="8" height="4" rx="1"/>
      <rect x="6" y="-121" width="8" height="4" rx="1"/>
    </g>
    <!-- fingerboard -->
    <rect x="-7" y="-122" width="14" height="165" rx="3" fill="#2c2c2c"/>
    <!-- bridge and tailpiece -->
    <rect x="-17" y="84" width="34" height="5" rx="1" fill="#ead6ad"/>
    <polygon points="-9,104 9,104 6,140 -6,140" fill="#2c2c2c"/>
    <!-- strings -->
    <g stroke="#f3f3f3" stroke-width="0.9">
      <line x1="-4.5" y1="-122" x2="-4.5" y2="104"/>
      <line x1="-1.5" y1="-122" x2="-1.5" y2="104"/>
      <line x1="1.5" y1="-122" x2="1.5" y2="104"/>
      <line x1="4.5" y1="-122" x2="4.5" y2="104"/>
    </g>
  </g>
  <!-- bow -->
  <g transform="translate(225,138) rotate(-8)">
    <line x1="-170" y1="38" x2="150" y2="38" stroke="#f3ead7" stroke-width="3"/>
    <line x1="-172" y1="30" x2="155" y2="30" stroke="#6b3e1e" stroke-width="4" stroke-linecap="round"/>
    <rect x="-165" y="28" width="16" height="12" rx="2" fill="#2c2c2c"/>
  </g>
</svg>
